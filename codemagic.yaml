workflows:
  generals-zh-ios-unsigned:
    name: Generals Zero Hour - iOS ARM64 (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        VULKAN_SDK_VERSION: "1.4.363.0"
        GX_BUNDLE_ID: "com.example.generalszh"
        GX_APP_NAME: "GeneralsXZH"

    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
        - $HOME/vcpkg/downloads
        - $HOME/.cache/vcpkg/archives
        - $HOME/VulkanSDK/1.4.363.0

    scripts:
      - name: Verify cloud build environment
        script: |
          set -euo pipefail
          echo "=== Host ==="
          sw_vers
          uname -a
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iOS|iphoneos'
          echo "=== Available disk ==="
          df -h /

      - name: Install build tools
        script: |
          set -euo pipefail
          brew install cmake ninja meson pkgconf python xcodegen glslang
          export PATH="$(brew --prefix)/bin:$(brew --prefix)/sbin:$PATH"          
          echo "=== Checking GLSL Shader Compiler ==="
          command -v glslangValidator
          glslangValidator --version
          cmake --version
          ninja --version
          meson --version
          xcodegen --version

      - name: Install LunarG Vulkan SDK with iOS libraries
        script: |
          set -euo pipefail

          SDK_VERSION="${VULKAN_SDK_VERSION}"
          SDK_ROOT="$HOME/VulkanSDK/${SDK_VERSION}"
          SDK_ZIP="$HOME/vulkansdk-macos-${SDK_VERSION}.zip"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          if [[ ! -f "$SDK_ROOT/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" ]]; then
            echo "Downloading LunarG Vulkan SDK ${SDK_VERSION}"
            curl --fail --location --retry 3 --retry-delay 3 \
              "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkansdk-macos-${SDK_VERSION}.zip" \
              --output "$SDK_ZIP"

            unzip -q "$SDK_ZIP" -d "$TMP_DIR"

            INSTALLER_APP="$(find "$TMP_DIR" -maxdepth 4 -type d -iname 'vulkansdk-macos-*.app' -print -quit)"
            if [[ -z "$INSTALLER_APP" ]]; then
              echo "ERROR: LunarG installer app was not found in the downloaded archive."
              find "$TMP_DIR" -maxdepth 4 -print | head -100
              exit 1
            fi

            INSTALLER_BIN="$(find "$INSTALLER_APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
            if [[ -z "$INSTALLER_BIN" ]]; then
              echo "ERROR: LunarG installer executable was not found."
              exit 1
            fi

            mkdir -p "$HOME/VulkanSDK"
            "$INSTALLER_BIN" \
              --root "$SDK_ROOT" \
              --accept-licenses \
              --default-answer \
              --confirm-command \
              install com.lunarg.vulkan.core com.lunarg.vulkan.ios copy_only=1
          else
            echo "Cached Vulkan SDK iOS libraries found."
          fi

          export VULKAN_SDK="$SDK_ROOT/macOS"
          test -f "$VULKAN_SDK/include/vulkan/vulkan.h"
          test -f "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          echo "VULKAN_SDK=$VULKAN_SDK"
          echo "Vulkan SDK iOS static MoltenVK library verified."

      - name: Clone and prepare vcpkg
        script: |
          set -euo pipefail
          VCPKG_ROOT="$HOME/vcpkg"
          export VCPKG_ROOT
          if [[ ! -d "$VCPKG_ROOT/.git" ]]; then
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" fetch --depth=1 origin
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT"

      - name: Initialize repository submodules
        script: |
          set -euo pipefail
          git submodule update --init --recursive
          test -d references/fbraz3-dxvk
          echo "Repository submodules initialized."

      - name: Fetch iOS runtime and stage fonts
        script: |
          set -euo pipefail
          export GX_MOLTENVK_ROOT="$HOME/GeneralsX/MoltenVK"
          export GX_FONTS="$HOME/GeneralsX/ios-staging/fonts"
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

          test -d "$GX_MOLTENVK_ROOT/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework"
          test -f "$GX_FONTS/arial.ttf"
          echo "iOS runtime and fonts staged."

      - name: Configure iOS ARM64 build
        script: |
          set -euo pipefail
          export VCPKG_ROOT="$HOME/vcpkg"
          export VULKAN_SDK="$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS"
          test -f "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          export PATH="$(brew --prefix)/bin:$(brew --prefix)/sbin:$PATH"
          command -v glslangValidator
          glslangValidator --version
          rm -rf build/ios-vulkan
          rm -rf vcpkg_installed/arm64-ios
          cmake --preset ios-vulkan

      - name: Compile Generals Zero Hour engine for iPhone
        script: |
          set -euo pipefail
          export VCPKG_ROOT="$HOME/vcpkg"
          export VULKAN_SDK="$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS"
          export PATH="$(brew --prefix)/bin:$(brew --prefix)/sbin:$PATH"
          command -v glslangValidator
          glslangValidator --version
          cmake --build build/ios-vulkan --target z_generals --parallel "$(sysctl -n hw.ncpu)"

          GAME_BIN="build/ios-vulkan/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          if [[ ! -f "$GAME_BIN" ]]; then
            echo "ERROR: expected iOS engine binary was not produced: $GAME_BIN"
            find build/ios-vulkan -name GeneralsXZH -type f -print
            exit 1
          fi
          file "$GAME_BIN"
          xcrun --sdk iphoneos lipo -info "$GAME_BIN"

      - name: Build unsigned iOS wrapper and assemble unsigned IPA
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          IOS_DIR="$ROOT/ios"
          BUILD_DIR="$ROOT/build/ios-vulkan"
          DERIVED="$ROOT/build/ios-derived"
          PACKAGE_DIR="$ROOT/build/ios-package"
          APP_NAME="${GX_APP_NAME}"
          BUNDLE_ID="${GX_BUNDLE_ID}"

          GAME_BIN="$BUILD_DIR/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          DXVK_BUILD="$BUILD_DIR/_deps/dxvk-build-macos"
          MVK_FRAMEWORK="$HOME/GeneralsX/MoltenVK/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework"

          test -f "$GAME_BIN"
          test -d "$MVK_FRAMEWORK"

          echo "Generating Xcode wrapper project."
          (cd "$IOS_DIR" && xcodegen generate --quiet)

          echo "Building wrapper with code signing explicitly disabled."
          xcodebuild \
            -project "$IOS_DIR/${APP_NAME}.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          SHELL_APP="$DERIVED/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [[ ! -d "$SHELL_APP" ]]; then
            echo "ERROR: unsigned Xcode wrapper was not produced: $SHELL_APP"
            exit 1
          fi

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          ditto "$SHELL_APP" "$PACKAGE_DIR/${APP_NAME}.app"
          APP="$PACKAGE_DIR/${APP_NAME}.app"

          echo "Replacing stub executable with the compiled iOS engine."
          cp "$GAME_BIN" "$APP/${APP_NAME}"

          echo "Embedding required runtime libraries."
          mkdir -p "$APP/Frameworks"
          REQUIRED_LIBS=(
            "$DXVK_BUILD/src/d3d8/libdxvk_d3d8.0.dylib"
            "$DXVK_BUILD/src/d3d9/libdxvk_d3d9.0.dylib"
            "$BUILD_DIR/_deps/sdl3-build/libSDL3.0.dylib"
            "$BUILD_DIR/_deps/sdl3_image-build/libSDL3_image.0.dylib"
            "$BUILD_DIR/_deps/openal_soft-build/libopenal.1.24.2.dylib"
          )

          for LIB in "${REQUIRED_LIBS[@]}"; do
            if [[ ! -f "$LIB" ]]; then
              echo "ERROR: required runtime library is missing: $LIB"
              exit 1
            fi
            cp "$LIB" "$APP/Frameworks/"
          done

          if [[ -f "$BUILD_DIR/libgamespy.dylib" ]]; then
            cp "$BUILD_DIR/libgamespy.dylib" "$APP/Frameworks/"
          fi

          if [[ -f "$APP/Frameworks/libopenal.1.24.2.dylib" ]]; then
            mv "$APP/Frameworks/libopenal.1.24.2.dylib" "$APP/Frameworks/libopenal.1.dylib"
          fi

          echo "Embedding dynamic MoltenVK framework."
          cp -R "$MVK_FRAMEWORK" "$APP/Frameworks/"

          echo "Adding framework runtime search path."
          install_name_tool -add_rpath "@executable_path/Frameworks" "$APP/${APP_NAME}" 2>/dev/null || true

          echo "Adding loose app icon fallbacks when available."
          ICON_SRC="$IOS_DIR/Stub/Assets.xcassets/AppIcon.appiconset/icon.png"
          if [[ -f "$ICON_SRC" ]]; then
            sips -z 120 120 "$ICON_SRC" --out "$APP/AppIcon60x60@2x.png" >/dev/null
            sips -z 152 152 "$ICON_SRC" --out "$APP/AppIcon76x76@2x.png" >/dev/null
            sips -z 167 167 "$ICON_SRC" --out "$APP/AppIcon83.5x83.5@2x.png" >/dev/null
          fi

          echo "This is a DEVELOPMENT package: proprietary game data is not included."
          echo "Copy your own legally obtained Zero Hour data into the app Documents folder after signing/installing."

          echo "Creating unsigned IPA archive."
          PAYLOAD="$PACKAGE_DIR/Payload"
          mkdir -p "$PAYLOAD"
          mv "$APP" "$PAYLOAD/${APP_NAME}.app"
          IPA="$PACKAGE_DIR/Generals-Zero-Hour-iOS-unsigned.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD" "$IPA"

          echo "Verifying IPA structure and unsigned status."
          test -s "$IPA"
          unzip -l "$IPA" | grep -q "Payload/${APP_NAME}.app/Info.plist"
          if codesign -dv "$PAYLOAD/${APP_NAME}.app" >/dev/null 2>&1; then
            echo "NOTE: wrapper or embedded components contain an existing signature; the app was not signed by this workflow."
          else
            echo "App bundle has no valid app signature (expected for this unsigned artifact)."
          fi
          ls -lh "$IPA"
          echo "Unsigned IPA created: $IPA"

    artifacts:
      - build/ios-package/Generals-Zero-Hour-iOS-unsigned.ipa
      - build/ios-package/Payload/**/*.app/**
      - build/ios-derived/Logs/**/*.log
      - /tmp/xcodebuild_logs/*.log
